[workspace]
resolver = "2"
members = [
  "services/auth",
  "services/imap-curator-auth-helper",
  "services/imap-curator-collector",
  "services/imap-curator-operator",
  "services/libs/checkback-core",
  "services/libs/db",
  "services/libs/imap-curator-common",
  "services/libs/observability",
  "services/libs/oauth-transport"
]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.86"
axum = "0.7.9"
chrono = { version = "0.4.38", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5.21", features = ["derive", "env"] }
http = "1.1.0"
imap = "=3.0.0-alpha.15"
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }
mailparse = "0.18.0"
native-tls = "0.2.12"
opentelemetry = "0.33.0"
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["trace", "grpc-tonic", "tls-ring", "tls-roots"] }
opentelemetry_sdk = { version = "0.33.0", features = ["rt-tokio"] }
oauth2 = { version = "4.4.2", default-features = false, features = [] }
reqwest = { version = "0.12.9", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
sqlx-core = { version = "0.8.6", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "migrate", "json"] }
sqlx-postgres = { version = "0.8.6", default-features = false, features = ["chrono", "json", "migrate", "uuid"] }
thiserror = "2.0.21"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "time"] }
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
tracing = "0.1.40"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.18", features = ["fmt", "env-filter"] }
utoipa = { version = "5.5.0", features = ["chrono"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum", "vendored"] }
uuid = { version = "1.10.0", features = ["v4"] }

[profile.release]
strip = "symbols"
