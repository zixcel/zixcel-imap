[workspace]
resolver = "3"
members = [".", "crates/mail-core", "crates/imap-client", "crates/smtp-client", "crates/message", "crates/planning"]
exclude = ["runtime"]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/zixcel/zixcel-mail"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
zeroize = "1.9.1"
tokio = { version = "1.52", features = ["rt", "macros", "net", "time", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.10"
zixcel-mail-core = { path = "crates/mail-core" }
zixcel-imap-client = { path = "crates/imap-client" }
zixcel-smtp-client = { path = "crates/smtp-client" }
zixcel-mail-message = { path = "crates/message" }
zixcel-mail-planning = { path = "crates/planning" }

[package]
name = "zixcel-mail"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
publish = false
description = "Provider-neutral bounded IMAP, SMTP submission and MIME mail clients"

[dependencies]
zixcel-mail-core.workspace = true
zixcel-imap-client.workspace = true
zixcel-smtp-client.workspace = true
zixcel-mail-message.workspace = true
zixcel-mail-planning.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "sync"] }
tokio-rustls.workspace = true
rcgen = "0.14.8"
tempfile = "3"
